[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookrelay"
version = "1.0.0"
description = "Receive, inspect, transform and replay webhooks without the plumbing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HookRelay contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
